<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 중… · AX 워크북</title>
<link rel="stylesheet" href="/styles.css">
<script src="/env.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1 id="msg">로그인 중…</h1>
    <p class="lede" id="sub">잠시만 기다려주세요.</p>
    <p id="retry" style="display:none"><a class="btn-link" href="/login">다시 시도</a></p>
  </div>
</div>

<script type="module">
  import { supabase } from '/js/supabase.js';

  const msg   = document.getElementById('msg');
  const sub   = document.getElementById('sub');
  const retry = document.getElementById('retry');

  function fail(text) {
    msg.textContent = '로그인하지 못했습니다';
    sub.textContent = text;
    retry.style.display = '';
  }

  // URL에 에러가 실려 오는 경우 (도메인 제한 트리거 등)
  const hash = new URLSearchParams(location.hash.slice(1));
  const err  = hash.get('error_description') || new URLSearchParams(location.search).get('error_description');
  if (err) {
    fail(/INVALID_DOMAIN/.test(err)
      ? '부스터스 이메일(@boosters.kr) 계정만 로그인할 수 있습니다.'
      : decodeURIComponent(err));
  } else {
    // detectSessionInUrl: true 이므로 세션이 잡힐 때까지 잠깐 기다립니다
    let tries = 0;
    const timer = setInterval(async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        clearInterval(timer);
        // 도메인 재확인 — DB 트리거가 1차로 막지만 여기서도 한 번 더 봅니다
        const { isBoostersEmail } = await import('/js/supabase.js');
        if (!isBoostersEmail(session.user.email)) {
          await supabase.auth.signOut();
          location.replace('/login?e=bad-domain');
          return;
        }
        // 세션 수명(6시간) 기산점을 여기서 찍습니다
        const { stampLogin } = await import('/js/auth.js');
        stampLogin();
        location.replace('/');
        return;
      }
      if (++tries > 25) { clearInterval(timer); fail('세션을 확인하지 못했습니다. 다시 시도해주세요.'); }
    }, 200);
  }
</script>
</body>
</html>
