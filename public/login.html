<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · AX 워크북</title>
<link rel="stylesheet" href="/styles.css">
<script src="/env.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="eyebrow">연결해서 일하기 · 4주</div>
    <h1>AX 워크북</h1>
    <p class="lede">회차별 실습을 기록하고, 내 업무 자동화 설계서를 만드는 곳입니다.</p>

    <div class="note" id="err" style="display:none"></div>

    <button class="primary gbtn" id="google">부스터스 계정으로 로그인</button>

    <p class="login-foot">
      <b>@boosters.kr</b> 계정만 로그인할 수 있습니다.<br>
      입력한 내용은 본인과 강사만 볼 수 있습니다.
    </p>
  </div>
</div>

<script type="module">
  import { signInWithGoogle, getMe } from '/js/auth.js';

  // 차단 사유 안내
  const MSG = {
    'bad-domain': '부스터스 이메일(<b>@boosters.kr</b>) 계정만 들어올 수 있습니다.<br>회사 계정으로 다시 로그인해주세요.',
    'no-profile': '계정 정보를 만들지 못했습니다. 부스터스 계정이 맞는데도 계속 이러면 강사에게 알려주세요.',
    'session-expired': '보안을 위해 로그인 후 <b>6시간</b>이 지나면 자동으로 로그아웃됩니다.<br>다시 로그인하시면 쓰던 내용은 그대로 남아 있습니다.',
  };
  const e = new URLSearchParams(location.search).get('e');
  if (MSG[e]) {
    const box = document.getElementById('err');
    box.innerHTML = MSG[e];
    box.style.display = '';
  }

  // 이미 로그인돼 있으면 홈으로 (차단 직후에는 건너뜁니다)
  if (!e) getMe().then(me => { if (me) location.replace('/'); });

  document.getElementById('google').addEventListener('click', signInWithGoogle);
</script>
</body>
</html>
