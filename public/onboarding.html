<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가입 정보 · AX 워크북</title>
<link rel="stylesheet" href="/styles.css">
<script src="/env.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card onboarding-card">
    <div class="eyebrow">환영합니다 · 한 번만 입력하면 됩니다</div>
    <h1>가입 정보</h1>
    <p class="lede">소속 팀은 강사가 참가자 명단을 정리할 때 씁니다. 어떤 강의를 몇 기로 들을지는 각 강의 홈에서 [참여하기]로 고릅니다.</p>

    <div class="onboarding-form">
      <label class="ob-field">
        <span>소속 팀</span>
        <input type="text" id="ob-team" placeholder="예: SCM본부 / People / Beauty Design" maxlength="40">
      </label>

      <button class="primary gbtn" id="ob-save" disabled>시작하기</button>
      <p class="login-foot">저장하면 강의 목록으로 이동합니다. 팀 이름은 마이페이지에서 언제든 고칠 수 있습니다.</p>
    </div>
  </div>
</div>

<script type="module">
  import { getMe, needsOnboarding, saveProfileBits } from '/js/auth.js';
  import { toast } from '/js/supabase.js';

  const teamInput = document.getElementById('ob-team');
  const saveBtn = document.getElementById('ob-save');

  function refresh() {
    saveBtn.disabled = !teamInput.value.trim();
  }
  teamInput.addEventListener('input', refresh);

  saveBtn.addEventListener('click', async () => {
    const team = teamInput.value.trim();
    if (!team) return;
    saveBtn.disabled = true;
    saveBtn.textContent = '저장 중…';
    const saved = await saveProfileBits({ team });
    if (!saved) {
      saveBtn.disabled = false;
      saveBtn.textContent = '시작하기';
      return;
    }
    toast('가입 정보가 저장되었습니다.');
    location.replace('/');
  });

  // 이미 온보딩이 끝난 사람이 직접 들어온 경우 → 강의 목록으로.
  (async () => {
    const me = await getMe();
    if (!me) { location.replace('/login'); return; }
    if (!needsOnboarding(me)) { location.replace('/'); return; }
    if (me.team && me.team !== '미지정') teamInput.value = me.team;
    refresh();
  })();
</script>
</body>
</html>
